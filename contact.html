<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
</head>
<body>
    <ul>
        <li style="color:crimson"><a style="color:crimson" href="others.html">Home page</a></li>
        <li style="color:darkgoldenrod"><a style="color:darkgoldenrod" href="about.html">About us</a></li>
        <li style="color:indigo"><a style="color:indigo" href="blog.html">My blog</a></li>
    </ul>
    <h1>Contact Us</h1>
    <form>
        <!-- Name Field -->
        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

        <!-- Email Field -->
        <label for="email">Your Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <!-- Message Field -->
        <label for="message">Your Message:</label><br>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea><br><br>

        <!-- Submit Button -->
        <button type="submit">Send</button>
    </form>
</body>
</html>
